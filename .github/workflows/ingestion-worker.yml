name: Ingestion worker (manual)

# Syncs already run inside the API process (INLINE_SYNC_WORKER=true), so this is a manual fallback
# only. It is not scheduled: on a private repository a run every 10 minutes would use more than the
# free GitHub Actions minutes each month. Start it from the Actions tab if a sync ever gets stuck.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kavi-ingestion-worker
  cancel-in-progress: false

jobs:
  process-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      AI_PROVIDER: gemini
      AI_MODEL: gemini-2.5-flash
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      LOG_LEVEL: INFO
      SYNC_JOB_STALE_AFTER_SECONDS: "2400"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Process one queued job
        run: python -m app.workers.ingestion_worker --once
