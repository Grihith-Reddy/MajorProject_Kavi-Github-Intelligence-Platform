name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kavi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kavi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kavi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
        working-directory: backend
      - name: Install Python dependency auditor
        run: python -m pip install pip-audit
        working-directory: backend
      - name: Run backend tests and migration rollback verification
        run: python -m pytest -q
        working-directory: backend
      - name: Audit backend dependencies
        run: python -m pip_audit -r requirements.txt
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Audit production dependencies
        run: npm audit
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
